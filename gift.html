<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>礼包码 - 小小屠龙-冰雪复古下载</title>
<link rel="canonical" href="https://xxtl.fmbly.com/gift.html">
<meta name="robots" content="index, follow">

<meta name="description" content="小小屠龙-冰雪复古 官方礼包码 VIP888：九品证明×3、八品证明×3、武神丹×10、5000W经验卷×2、笑傲红尘×1、气运卷×6。">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="gift">
<header class="site-header" id="siteHeader"></header>
<main class="page">

  <section class="section">
    <div class="container">
      <div class="section-head center reveal">
        <span class="eyebrow">Gift Code</span>
        <h1 class="section-title">官方<span class="hl">礼包码</span></h1>
        <p class="section-desc">复���下方礼包码，进入游戏后在「福利 — 兑换码」处输入领取。</p>
      </div>

      <div style="max-width:620px;margin:0 auto" id="codeBox"></div>
    </div>
  </section>

</main>

<footer class="site-footer" id="siteFooter"></footer>
<button class="to-top" id="toTop" aria-label="返回顶部"></button>

<script src="mock.js"></script>
<script src="api.js"></script>
<script src="app.js"></script>
<script>
(function () {
  var esc = App.esc;
  var box = document.getElementById('codeBox');
  var codes = (DB.gifts && DB.gifts.codes) ? Object.keys(DB.gifts.codes) : [];

  if (!codes.length) {
    box.innerHTML = '<div class="empty">礼包码稍后公布，请留意官方公告</div>';
    return;
  }

  box.innerHTML = codes.map(function (k) {
    var g = DB.gifts.codes[k];
    return '<div class="card corner reveal">' +
      '<p class="card-text" style="text-align:center;margin:0 0 4px">' + esc(g.name) + '</p>' +
      '<div style="text-align:center;font-family:var(--font-display);font-size:40px;font-weight:800;' +
        'letter-spacing:.2em;color:var(--gold);margin:10px 0 20px">' + esc(k) + '</div>' +
      '<div style="text-align:center;margin-bottom:24px">' +
        '<button class="btn btn-gold" data-code="' + esc(k) + '" type="button">复制礼包码</button>' +
      '</div>' +
      '<div class="divider"></div>' +
      '<h2 class="card-title" style="font-size:16px;margin:18px 0 12px">礼包内容</h2>' +
      '<div class="gift-row">' +
        (g.items || []).map(function (i) { return '<span class="tag tag-gold">' + esc(i) + '</span>'; }).join('') +
      '</div>' +
      '<div class="divider"></div>' +
      '<p class="card-text" style="font-size:13.5px;line-height:1.95;margin:0">' +
        '<b>使用方式：</b>进入游戏 → 点击「福利」→ 选择「兑换码」→ 输入上方礼包码即可领取。每个角色限领一次。' +
      '</p>' +
    '</div>';
  }).join('');

  /* 复制 */
  box.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-code]');
    if (!b) return;
    var code = b.dataset.code;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(code).then(function () {
        App.toast('已复制：' + code, 'ok');
      }, function () {
        App.toast('复制失败，请长按手动选择', 'error');
      });
      return;
    }
    var ta = document.createElement('textarea');
    ta.value = code;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); App.toast('已复制：' + code, 'ok'); }
    catch (err) { App.toast('复制失败，请长按手动选择', 'error'); }
    ta.remove();
  });

  App.initDynamic(document);
})();
</script>
</body>
</html>
